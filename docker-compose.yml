version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/smart-college-lost-and-found
      - JWT_SECRET=antigravity_super_secret_jwt_key_2026
    depends_on:
      - mongo
    volumes:
      - ./server/uploads:/app/uploads
  
  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
